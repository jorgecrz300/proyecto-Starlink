<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ANTOLIS - Terminal Interface</title>
    <style>
        body {
            background-color: #050508;
            color: #00ffcc;
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .terminal-container {
            width: 800px;
            height: 90vh;
            background: rgba(10, 10, 15, 0.95);
            border: 1px solid #00ffcc44;
            border-radius: 8px;
            box-shadow: 0 0 20px rgba(0, 255, 204, 0.1);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .header {
            padding: 15px 20px;
            background: #08080f;
            border-bottom: 1px solid #00ffcc33;
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .face-avatar {
            width: 40px;
            height: 40px;
            border: 1px solid #00ffcc;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 18px;
            background: #00ffcc11;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(0, 255, 204, 0.4); }
            70% { box-shadow: 0 0 0 10px rgba(0, 255, 204, 0); }
            100% { box-shadow: 0 0 0 0 rgba(0, 255, 204, 0); }
        }
        .title-area h1 {
            margin: 0;
            font-size: 16px;
            letter-spacing: 2px;
        }
        .title-area p {
            margin: 2px 0 0;
            font-size: 10px;
            color: #00ffcc77;
        }
        .chat-box {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .message {
            max-width: 75%;
            padding: 12px 16px;
            border-radius: 4px;
            font-size: 14px;
            line-height: 1.4;
        }
        .message.antolis {
            background: #00ffcc0d;
            border-left: 3px solid #00ffcc;
            align-self: flex-start;
            color: #e0e0e0;
        }
        .message.user {
            background: #111122;
            border-right: 3px solid #7700ff;
            align-self: flex-end;
            color: #ffffff;
        }
        .input-area {
            padding: 15px 20px;
            background: #08080f;
            border-top: 1px solid #00ffcc33;
            display: flex;
        }
        .input-area input {
            width: 100%;
            background: transparent;
            border: none;
            color: #00ffcc;
            font-family: 'Courier New', Courier, monospace;
            font-size: 14px;
            outline: none;
        }
    </style>
</head>
<body>
    <div class="terminal-container">
        <div class="header">
            <div class="face-avatar">⊙_⊙</div>
            <div class="title-area">
                <h1>ANTOLIS TERMINAL v2.0</h1>
                <p>SECURE NEURAL LINK ACTIVE</p>
            </div>
        </div>
        <div class="chat-box" id="chatBox">
            <div class="message antolis">Neural link established. Antolis interface online, Sir Jorge.</div>
        </div>
        <div class="input-area">
            <input type="text" id="userInput" placeholder="Type command for Antolis..." autofocus>
        </div>
    </div>
    <script>
        // Aquí conectarías tu lógica de JavaScript habitual para enviar y recibir mensajes del server.mjs
    </script>
</body>
</html>
