<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Crelis</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700&family=Manrope:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
    --bg: #0c0c0c;
    --ink: #f4f1eb;
    --bone: #d8d2c6;
    --mute: #8f8b84;
    --line: rgba(216, 210, 198, 0.18);
    --bad: #e23d3d;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
    background: var(--bg);
    color: var(--ink);
    font-family: Manrope, sans-serif;
    display: flex;
    flex-direction: column;
}
header {
    padding: 28px 20px 16px;
}
.kicker {
    margin: 0 0 8px;
    color: var(--mute);
    font-size: 12px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
}
h1 {
    margin: 0;
    font-family: Syne, sans-serif;
    font-size: 64px;
    line-height: 0.85;
    letter-spacing: -0.04em;
}
.row {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    margin-top: 18px;
    padding-top: 12px;
    border-top: 1px solid var(--bone);
    color: var(--mute);
    font-size: 13px;
}
#estado { color: var(--bone); letter-spacing: 0.14em; text-transform: uppercase; }
#estado.bad { color: var(--bad); }
main {
    flex: 1;
    overflow: auto;
    padding: 8px 20px 12px;
}
.entry { padding: 16px 0 16px 14px; border-bottom: 1px solid var(--line); }
.entry.crelis { border-left: 2px solid var(--bone); }
.when { color: var(--mute); font-size: 12px; letter-spacing: 0.08em; }
.who {
    margin: 4px 0;
    font-size: 11px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--bone);
}
.text { font-size: 16px; line-height: 1.4; }
form {
    display: flex;
    gap: 8px;
    padding: 12px 16px 20px;
    border-top: 1px solid var(--line);
}
textarea {
    flex: 1;
    height: 52px;
    resize: none;
    border: 0;
    border-bottom: 1px solid var(--bone);
    background: transparent;
    color: var(--ink);
    font: 16px/1.3 Manrope, sans-serif;
    padding: 8px 0;
    outline: none;
}
button {
    align-self: flex-end;
    height: 44px;
    padding: 0 14px;
    border: 0;
    background: var(--bone);
    color: #111;
    font-family: Syne, sans-serif;
    letter-spacing: 0.08em;
    text-transform: uppercase;
}
@media (min-width: 800px) {
    body { max-width: 760px; margin: 0 auto; }
    h1 { font-size: 92px; }
}
</style>
</head>
<body>
<header>
    <p class="kicker">Trabajo</p>
    <h1>Crelis</h1>
    <div class="row">
        <span id="fecha"></span>
        <span id="estado">Guardado</span>
    </div>
</header>
<main id="libro"></main>
<form id="linea">
    <textarea id="texto" placeholder="Qué hay que anotar" required></textarea>
    <button type="submit">Anotar</button>
</form>
<script>
const KEY = "crelis-libro-v2";
const libro = document.getElementById("libro");
const estado = document.getElementById("estado");
document.getElementById("fecha").textContent = new Date().toLocaleDateString("es-MX", {
    weekday: "short", day: "numeric", month: "short"
});
function load() {
    try { return JSON.parse(localStorage.getItem(KEY)) || []; }
    catch { return []; }
}
function paint(items) {
    libro.innerHTML = "";
    const list = items.length ? items : [{ when: "", who: "Crelis", text: "Hoy no hay nada anotado." }];
    for (const item of list) {
        const article = document.createElement("article");
        article.className = "entry" + (item.who === "Crelis" ? " crelis" : "");
        article.innerHTML = '<div class="when"></div><div class="who"></div><div class="text"></div>';
        article.querySelector(".when").textContent = item.when || "";
        article.querySelector(".who").textContent = item.who;
        article.querySelector(".text").textContent = item.text;
        libro.appendChild(article);
    }
    libro.scrollTop = libro.scrollHeight;
}
let items = load();
if (!items.length) {
    items = [
        { when: "06:40", who: "Tú", text: "El patrón pidió contar los de la cerca norte." },
        { when: "06:44", who: "Crelis", text: "Quedó anotado. No hay número. No lo invento." }
    ];
    localStorage.setItem(KEY, JSON.stringify(items));
}
paint(items);
document.getElementById("linea").addEventListener("submit", (event) => {
    event.preventDefault();
    const text = document.getElementById("texto").value.trim();
    if (!text) return;
    const when = new Date().toLocaleTimeString("es-MX", { hour: "2-digit", minute: "2-digit" });
    items.push({ when, who: "Tú", text });
    items.push({ when, who: "Crelis", text: "Quedó anotado. No agregué nada que tú no hayas escrito." });
    try {
        localStorage.setItem(KEY, JSON.stringify(items));
        estado.textContent = "Guardado";
        estado.classList.remove("bad");
    } catch {
        estado.textContent = "No quedó anotado";
        estado.classList.add("bad");
    }
    document.getElementById("texto").value = "";
    paint(items);
});
</script>
</body>
</html>
