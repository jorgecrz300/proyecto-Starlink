<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Antolis Project - Core Interface</title>
<style>
* { box-sizing: border-box; }
body {
background-color: #0b0f19;
color: #58a6ff;
font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
margin: 0;
display: flex;
justify-content: center;
align-items: center;
height: 100vh;
overflow: hidden;
}
.main-container {
width: 100%;
max-width: 650px;
height: 90vh;
background: #111625;
border: 1px solid #1f293d;
border-radius: 16px;
display: flex;
flex-direction: column;
box-shadow: 0 0 40px rgba(88, 166, 255, 0.15);
padding: 20px;
}
/* Cabecera con la carita animada */
.header-section {
display: flex;
align-items: center;
border-bottom: 1px solid #1f293d;
padding-bottom: 15px;
margin-bottom: 15px;
}
.starlink-face {
background: #161b22;
border: 2px solid #58a6ff;
border-radius: 50%;
width: 60px;
height: 60px;
display: flex;
justify-content: center;
align-items: center;
position: relative;
box-shadow: 0 0 15px rgba(88, 166, 255, 0.3);
margin-right: 15px;
flex-shrink: 0;
}
.eye {
width: 12px;
height: 12px;
background: #c9d1d9;
border-radius: 50%;
margin: 6px;
position: relative;
display: flex;
justify-content: center;
align-items: center;
overflow: hidden;
transition: height 0.1s;
}
.pupil { width: 5px; height: 5px; background: #0b0f19; border-radius: 50%; position: absolute; }
.mouth { width: 20px; height: 3px; background: #58a6ff; position: absolute; bottom: 12px; border-radius: 5px; transition: all 0.2s; }
.speaking { height: 6px !important; border-radius: 50% !important; }


.system-info {
  flex: 1;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.system-info h2 { margin: 0; font-size: 1.1rem; color: #fff; letter-spacing: 1px; }
.system-info p { margin: 3px 0 0 0; font-size: 0.75rem; color: #8b949e; }


.clear-history-btn {
  background: transparent;
  border: none;
  color: #8b949e;
  font-size: 0.7rem;
  cursor: pointer;
  padding: 0;
  text-decoration: underline;
  margin-top: 4px;
}
.clear-history-btn:hover {
  color: #58a6ff;
}


/* Caja de chat grande y limpia */
.chat-container {
flex: 1;
background: #0d1117;
border: 1px solid #1f293d;
border-radius: 12px;
padding: 15px;
overflow-y: auto;
display: flex;
flex-direction: column;
gap: 12px;
margin-bottom: 15px;
}
.message {
max-width: 85%;
padding: 10px 14px;
border-radius: 10px;
font-size: 0.9rem;
line-height: 1.4;
}
.message.user {
background: #1f293d;
color: #fff;
align-self: flex-end;
border-bottom-right-radius: 2px;
}
.message.starlink {
background: #161b22;
color: #58a6ff;
align-self: flex-start;
border: 1px solid #30363d;
border-bottom-left-radius: 2px;
}
.message strong { display: block; font-size: 0.75rem; margin-bottom: 3px; opacity: 0.7; }


/* Área de escritura grande con botón de adjuntar */
.input-wrapper {
position: relative;
display: flex;
align-items: center;
gap: 10px;
}
.upload-btn {
background: #161b22;
border: 2px solid #1f293d;
color: #58a6ff;
width: 60px;
height: 60px;
border-radius: 10px;
cursor: pointer;
display: flex;
justify-content: center;
align-items: center;
font-size: 1.2rem;
flex-shrink: 0;
transition: border-color 0.2s, background 0.2s;
}
.upload-btn:hover {
border-color: #58a6ff;
background: #1f293d;
}
.image-preview-tag {
font-size: 0.7rem;
color: #3fb950;
margin-bottom: 4px;
display: none;
}
textarea {
width: 100%;
height: 60px;
background: #0d1117;
border: 2px solid #1f293d;
color: #fff;
padding: 12px 15px;
border-radius: 10px;
outline: none;
font-size: 0.95rem;
font-family: inherit;
resize: none;
box-sizing: border-box;
transition: border-color 0.2s;
}
textarea:focus {
border-color: #58a6ff;
box-shadow: 0 0 10px rgba(88, 166, 255, 0.1);
}
</style>
</head>
<body>
<div class="main-container">
<!-- Cabecera -->
<div class="header-section">
<div class="starlink-face">
<div class="eye"><div class="pupil"></div></div>
<div class="eye"><div class="pupil"></div></div>
<div class="mouth" id="mouth"></div>
</div>
<div class="system-info">
<div>
<h2>ANTOLIS CORE v2.0</h2>
<p>NEURAL INTERFACE ACTIVE</p>
</div>
<button class="clear-history-btn" onclick="clearHistory()">Clear history</button>
</div>
</div>
<!-- Chat -->
<div class="chat-container" id="chat-output"></div>


<!-- Input grande con botón de imagen -->
<div>
<div id="image-preview-tag" class="image-preview-tag">📷 Image attached and ready to send</div>
<div class="input-wrapper">
<input type="file" id="image-input" accept="image/*" style="display: none;" onchange="handleImageSelection(event)">
<button class="upload-btn" onclick="document.getElementById('image-input').click()" title="Attach image">📷</button>
<textarea id="user-input" placeholder="Transmit command or image to Antolis... (Press Enter to send)" autocomplete="off"></textarea>
</div>
</div>


</div>
<script>
const chatOutput = document.getElementById('chat-output');
const mouth = document.getElementById('mouth');
const userInput = document.getElementById('user-input');
const imagePreviewTag = document.getElementById('image-preview-tag');
let selectedImageBase64 = null;

// Historial de la conversación para la IA
let conversationHistory = [];

// Manejar selección de imagen
function handleImageSelection(event) {
    const file = event.target.files[0];
    if (file) {
        const reader = new FileReader();
        reader.onload = function(e) {
            selectedImageBase64 = e.target.result;
            imagePreviewTag.style.display = 'block';
            imagePreviewTag.textContent = `📷 Attached: ${file.name}`;
        };
        reader.readAsDataURL(file);
    }
}

// Función de voz (Speech Synthesis)
function speak(text) {
    const synth = window.speechSynthesis;
    const utter = new SpeechSynthesisUtterance(text);
    utter.lang = 'en-US';
    utter.onstart = () => mouth.classList.add('speaking');
    utter.onend = () => mouth.classList.remove('speaking');
    synth.speak(utter);
}

// Cargar historial persistente al iniciar
window.onload = () => {
    const savedHistory = localStorage.getItem('antolis_chat_history');
    const savedMessages = localStorage.getItem('antolis_messages_array');
    
    if (savedHistory && savedMessages) {
        chatOutput.innerHTML = savedHistory;
        conversationHistory = JSON.parse(savedMessages);
        chatOutput.scrollTop = chatOutput.scrollHeight;
    } else {
        const greeting = "Neural link established. Antolis interface online, sir.";
        appendMessage("Antolis", greeting);
        speak(greeting);
        // Guardamos el saludo inicial en el historial de la IA
        conversationHistory.push({ role: "assistant", content: greeting });
        saveHistoryToStorage();
    }
};

function saveHistoryToStorage() {
    localStorage.setItem('antolis_chat_history', chatOutput.innerHTML);
    localStorage.setItem('antolis_messages_array', JSON.stringify(conversationHistory));
}

function clearHistory() {
    localStorage.removeItem('antolis_chat_history');
    localStorage.removeItem('antolis_messages_array');
    chatOutput.innerHTML = '';
    conversationHistory = [];
    const resetMsg = "Memory banks cleared, sir.";
    appendMessage("Antolis", resetMsg);
    speak(resetMsg);
    conversationHistory.push({ role: "assistant", content: resetMsg });
    saveHistoryToStorage();
}

function appendMessage(sender, text) {
    const msgDiv = document.createElement('div');
    msgDiv.classList.add('message');
    msgDiv.classList.add(sender === 'You' ? 'user' : 'Antolis');
    msgDiv.innerHTML = `<strong>${sender}</strong>${text}`;
    chatOutput.appendChild(msgDiv);
    chatOutput.scrollTop = chatOutput.scrollHeight;
}

// Enviar mensaje con la tecla Enter
userInput.addEventListener('keydown', async function (e) {
    if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        const userMsg = this.value.trim();
        if (userMsg === "" && !selectedImageBase64) return;

        let displayText = userMsg;
        if (selectedImageBase64) {
            displayText += `<br><img src="${selectedImageBase64}" style="max-width: 200px; border-radius: 8px; margin-top: 5px;">`;
        }
        
        appendMessage('You', displayText);

        // Preparamos el contenido para enviarlo al servidor (soporta texto e imagen multimodal)
        let userContentPayload = [];
        if (userMsg !== "") {
            userContentPayload.push({ type: "text", text: userMsg });
        } else if (selectedImageBase64) {
            userContentPayload.push({ type: "text", text: "What is this?" });
        }
        if (selectedImageBase64) {
            userContentPayload.push({
                type: "image_url",
                image_url: { url: selectedImageBase64 }
            });
        }

        // Agregamos el mensaje del usuario al historial de la IA
        // Si solo mandó texto plano, podemos guardar un string simple o el array multimodal. 
        // Para simplificar el historial, guardamos el texto o el payload estructurado:
        conversationHistory.push({ 
            role: "user", 
            content: userContentPayload.length === 1 && userContentPayload[0].type === "text" 
                     ? userMsg 
                     : userContentPayload 
        });

        const payloadHistory = [...conversationHistory];
        
        this.value = '';
        selectedImageBase64 = null;
        imagePreviewTag.style.display = 'none';

        try {
            const res = await fetch('/api/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ historial: payloadHistory })
            });
            const data = await res.json();
            const aiReply = data.respuesta || data.error;

            appendMessage('Antolis', aiReply);
            speak(aiReply);

            // Agregamos la respuesta de Antolis al historial
            conversationHistory.push({ role: "assistant", content: aiReply });
            saveHistoryToStorage();

        } catch (error) {
            const errorMsg = "Local server transmission error.";
            appendMessage('Antolis', errorMsg);
            speak(errorMsg);
        }
    }
});

// Movimiento de ojos interactivo
document.addEventListener('mousemove', (e) => {
    const pupils = document.querySelectorAll('.pupil');
    const x = (e.clientX / window.innerWidth - 0.5) * 4;
    const y = (e.clientY / window.innerHeight - 0.5) * 4;
    pupils.forEach(p => p.style.transform = `translate(${x}px,${y}px)`);
});

// Animación de parpadeo
setInterval(() => {
    const eyes = document.querySelectorAll('.eye');
    eyes.forEach(e => e.style.height = '2px');
    setTimeout(() => eyes.forEach(e => e.style.height = '12px'), 150);
}, 4500);
</script>
</body>
</html>
