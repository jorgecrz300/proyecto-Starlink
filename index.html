<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Antolis Project - Core Interface</title>

<style>

* { box-sizing: border-box; }

body {

background-color: #0b0f19;

color: #58a6ff;

font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;

margin: 0;

display: flex;

justify-content: center;

align-items: center;

height: 100vh;

overflow: hidden;

}



.main-container {

width: 100%;

max-width: 650px;

height: 90vh;

background: #111625;

border: 1px solid #1f293d;

border-radius: 16px;

display: flex;

flex-direction: column;

box-shadow: 0 0 40px rgba(88, 166, 255, 0.15);

padding: 20px;

}



/* Cabecera con la carita animada */

.header-section {

display: flex;

align-items: center;

border-bottom: 1px solid #1f293d;

padding-bottom: 15px;

margin-bottom: 15px;

}



.starlink-face {

background: #161b22;

border: 2px solid #58a6ff;

border-radius: 50%;

width: 60px;

height: 60px;

display: flex;

justify-content: center;

align-items: center;

position: relative;

box-shadow: 0 0 15px rgba(88, 166, 255, 0.3);

margin-right: 15px;

flex-shrink: 0;

}



/* AQUÍ ESTÁ LA CORRECCIÓN: overflow: hidden para que el pupil no salga del ojo */

.eye {

width: 12px;

height: 12px;

background: #c9d1d9;

border-radius: 50%;

margin: 6px;

position: relative;

display: flex;

justify-content: center;

align-items: center;

overflow: hidden;

transition: height 0.1s;

}


.pupil { width: 5px; height: 5px; background: #0b0f19; border-radius: 50%; position: absolute; }

.mouth { width: 20px; height: 3px; background: #58a6ff; position: absolute; bottom: 12px; border-radius: 5px; transition: all 0.2s; }

.speaking { height: 6px !important; border-radius: 50% !important; }



.system-info h2 { margin: 0; font-size: 1.1rem; color: #fff; letter-spacing: 1px; }

.system-info p { margin: 3px 0 0 0; font-size: 0.75rem; color: #8b949e; }



/* Caja de chat grande y limpia */

.chat-container {

flex: 1;

background: #0d1117;

border: 1px solid #1f293d;

border-radius: 12px;

padding: 15px;

overflow-y: auto;

display: flex;

flex-direction: column;

gap: 12px;

margin-bottom: 15px;

}



.message {

max-width: 85%;

padding: 10px 14px;

border-radius: 10px;

font-size: 0.9rem;

line-height: 1.4;

}



.message.user {

background: #1f293d;

color: #fff;

align-self: flex-end;

border-bottom-right-radius: 2px;

}



.message.starlink {

background: #161b22;

color: #58a6ff;

align-self: flex-start;

border: 1px solid #30363d;

border-bottom-left-radius: 2px;

}



.message strong { display: block; font-size: 0.75rem; margin-bottom: 3px; opacity: 0.7; }



/* Área de escritura grande */

.input-wrapper {

position: relative;

display: flex;

align-items: center;

}



textarea {

width: 100%;

height: 60px;

background: #0d1117;

border: 2px solid #1f293d;

color: #fff;

padding: 12px 15px;

border-radius: 10px;

outline: none;

font-size: 0.95rem;

font-family: inherit;

resize: none;

box-sizing: border-box;

transition: border-color 0.2s;

}



textarea:focus {

border-color: #58a6ff;

box-shadow: 0 0 10px rgba(88, 166, 255, 0.1);

}

</style>

</head>

<body>



<div class="main-container">

<!-- Cabecera -->

<div class="header-section">

<div class="starlink-face">

<div class="eye"><div class="pupil"></div></div>

<div class="eye"><div class="pupil"></div></div>

<div class="mouth" id="mouth"></div>

</div>

<div class="system-info">

<h2>ANTOLIS CORE v2.0</h2>

<p>NEURAL INTERFACE ACTIVE</p>

</div>

</div>



<!-- Chat -->

<div class="chat-container" id="chat-output"></div>



<!-- Input grande -->

<div class="input-wrapper">

<textarea id="user-input" placeholder="Transmit command to Antolis... (Press Enter to send)" autocomplete="off"></textarea>

</div>

</div>



<script>

const chatOutput = document.getElementById('chat-output');

const mouth = document.getElementById('mouth');

const userInput = document.getElementById('user-input');



// Función de voz (Speech Synthesis)

function speak(text) {

const synth = window.speechSynthesis;

const utter = new SpeechSynthesisUtterance(text);

utter.lang = 'en-US';

utter.onstart = () => mouth.classList.add('speaking');

utter.onend = () => mouth.classList.remove('speaking');

synth.speak(utter);

}



// Saludo inicial

window.onload = () => {

const greeting = "Neural link established. Antolis interface online, sir.";

appendMessage("Antolis", greeting);

speak(greeting);

};



function appendMessage(sender, text) {

const msgDiv = document.createElement('div');

msgDiv.classList.add('message');

msgDiv.classList.add(sender === 'You' ? 'user' : 'Antolis');

msgDiv.innerHTML = `<strong>${sender}</strong>${text}`;

chatOutput.appendChild(msgDiv);

chatOutput.scrollTop = chatOutput.scrollHeight;

}



// Enviar mensaje con la tecla Enter (sin salto de línea)

userInput.addEventListener('keydown', async function (e) {

if (e.key === 'Enter' && !e.shiftKey) {

e.preventDefault();

const userMsg = this.value.trim();

if (userMsg === "") return;



appendMessage('You', userMsg);

this.value = '';



try {

const res = await fetch('/api/chat', {

method: 'POST',

headers: { 'Content-Type': 'application/json' },

body: JSON.stringify({ mensaje: userMsg })

});

const data = await res.json();

const aiReply = data.respuesta || data.error;



appendMessage('Antolis', aiReply);

speak(aiReply);

} catch (error) {

const errorMsg = "Local server transmission error.";

appendMessage('Antolis', errorMsg);

speak(errorMsg);

}

}

});



// Movimiento de ojos interactivo (reducido para que se mantenga dentro del óvalo)

document.addEventListener('mousemove', (e) => {

const pupils = document.querySelectorAll('.pupil');

const x = (e.clientX / window.innerWidth - 0.5) * 4;

const y = (e.clientY / window.innerHeight - 0.5) * 4;

pupils.forEach(p => p.style.transform = `translate(${x}px,${y}px)`);

});



// Animación de parpadeo

setInterval(() => {

const eyes = document.querySelectorAll('.eye');

eyes.forEach(e => e.style.height = '2px');

setTimeout(() => eyes.forEach(e => e.style.height = '12px'), 150);

}, 4500);

</script>

</body>

</html>
