<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Crelis</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
<style>
:root {
    --paper: #121714;
    --sheet: #181e1a;
    --ink: #e8e2d6;
    --copper: #b08d62;
    --copper-dim: #7c6244;
    --line: rgba(176, 141, 98, 0.32);
    --mute: #8d877c;
    --bad: #c45448;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
    background: var(--paper);
    color: var(--ink);
    font-family: "Libre Baskerville", Georgia, serif;
    display: flex;
    flex-direction: column;
    min-height: 100%;
}
header {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    gap: 16px;
    padding: 22px 22px 14px;
    border-bottom: 1px solid var(--line);
}
.brand { display: flex; align-items: center; gap: 12px; }
.stamp {
    width: 36px;
    height: 36px;
    border: 1px solid var(--copper);
    color: var(--copper);
    display: grid;
    place-items: center;
    font-family: "Source Sans 3", sans-serif;
    font-weight: 600;
    letter-spacing: 0.08em;
}
h1 {
    margin: 0;
    font-size: 22px;
    font-weight: 400;
    letter-spacing: 0.22em;
    text-transform: uppercase;
}
.sub {
    margin-top: 2px;
    color: var(--mute);
    font-family: "Source Sans 3", sans-serif;
    font-size: 13px;
    letter-spacing: 0.04em;
}
.meta {
    text-align: right;
    font-family: "Source Sans 3", sans-serif;
    font-size: 13px;
    color: var(--mute);
}
#estado { display: block; margin-top: 4px; color: var(--copper); letter-spacing: 0.08em; text-transform: uppercase; }
#estado.bad { color: var(--bad); }
main {
    flex: 1;
    overflow: auto;
    padding: 8px 22px 18px;
}
.entry {
    display: grid;
    grid-template-columns: 72px 1fr;
    gap: 12px;
    padding: 14px 0;
    border-bottom: 1px solid var(--line);
}
.when {
    color: var(--copper-dim);
    font-family: "Source Sans 3", sans-serif;
    font-size: 13px;
    padding-top: 3px;
}
.who {
    font-family: "Source Sans 3", sans-serif;
    font-size: 11px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--copper);
    margin-bottom: 4px;
}
.entry.crelis .text { color: #d9cbb6; }
.text { font-size: 16px; line-height: 1.45; }
form {
    display: flex;
    gap: 10px;
    padding: 14px 22px 18px;
    border-top: 1px solid var(--line);
    background: var(--sheet);
}
textarea {
    flex: 1;
    resize: none;
    height: 52px;
    border: 1px solid var(--line);
    background: transparent;
    color: var(--ink);
    font-family: "Libre Baskerville", Georgia, serif;
    font-size: 16px;
    padding: 12px;
    outline: none;
}
button {
    border: 1px solid var(--copper);
    background: transparent;
    color: var(--copper);
    font-family: "Source Sans 3", sans-serif;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    padding: 0 16px;
    cursor: pointer;
}
@media (max-width: 640px) {
    header, main, form { padding-left: 14px; padding-right: 14px; }
    h1 { font-size: 18px; letter-spacing: 0.16em; }
    .entry { grid-template-columns: 58px 1fr; }
    form { flex-direction: column; }
    button { height: 44px; }
}
</style>
</head>
<body>
<header>
    <div class="brand">
        <div class="stamp">C</div>
        <div>
            <h1>Crelis</h1>
            <div class="sub">Libro del día</div>
        </div>
    </div>
    <div class="meta">
        <span id="fecha"></span>
        <span id="estado">Guardado</span>
    </div>
</header>
<main id="libro"></main>
<form id="linea">
    <textarea id="texto" placeholder="Anota lo que pidió el patrón" required></textarea>
    <button type="submit">Anotar</button>
</form>
<script>
const KEY = "crelis-libro-v1";
const libro = document.getElementById("libro");
const estado = document.getElementById("estado");
const fecha = document.getElementById("fecha");
fecha.textContent = new Date().toLocaleDateString("es-MX", { weekday: "long", day: "numeric", month: "long" });

function load() {
    try { return JSON.parse(localStorage.getItem(KEY)) || []; }
    catch { return []; }
}
function paint(items) {
    libro.innerHTML = "";
    if (!items.length) {
        libro.innerHTML = '<article class="entry crelis"><div class="when"></div><div><div class="who">Crelis</div><div class="text">Hoy no hay nada anotado.</div></div></article>';
        return;
    }
    for (const item of items) {
        const article = document.createElement("article");
        article.className = "entry" + (item.who === "Crelis" ? " crelis" : "");
        article.innerHTML = '<div class="when"></div><div><div class="who"></div><div class="text"></div></div>';
        article.querySelector(".when").textContent = item.when;
        article.querySelector(".who").textContent = item.who;
        article.querySelector(".text").textContent = item.text;
        libro.appendChild(article);
    }
    libro.scrollTop = libro.scrollHeight;
}
let items = load();
if (!items.length) {
    items = [
        { when: "06:40", who: "Tú", text: "El patrón pidió contar los de la cerca norte." },
        { when: "06:44", who: "Crelis", text: "Quedó anotado. No hay número todavía. No lo invento." }
    ];
    localStorage.setItem(KEY, JSON.stringify(items));
}
paint(items);

document.getElementById("linea").addEventListener("submit", (event) => {
    event.preventDefault();
    const text = document.getElementById("texto").value.trim();
    if (!text) return;
    const when = new Date().toLocaleTimeString("es-MX", { hour: "2-digit", minute: "2-digit" });
    items.push({ when, who: "Tú", text });
    items.push({ when, who: "Crelis", text: "Quedó anotado. No agregué nada que tú no hayas escrito." });
    try {
        localStorage.setItem(KEY, JSON.stringify(items));
        estado.textContent = "Guardado";
        estado.classList.remove("bad");
    } catch {
        estado.textContent = "No quedó anotado";
        estado.classList.add("bad");
    }
    document.getElementById("texto").value = "";
    paint(items);
});
</script>
</body>
</html>
