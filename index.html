<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Antolis Minimal</title>
    <style>
        body {
            background-color: #121212;
            color: #e0e0e0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        header {
            padding: 16px 24px;
            border-bottom: 1px solid #222;
            display: flex;
            align-items: center;
            gap: 12px;
            background: #181818;
        }

        header h2 {
            font-size: 15px;
            font-weight: 500;
            letter-spacing: 0.5px;
            color: #fff;
        }

        #chatContainer {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
            max-width: 800px;
            width: 100%;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .msg {
            display: flex;
            gap: 16px;
            line-height: 1.6;
            font-size: 14px;
        }

        .msg.user {
            justify-content: flex-end;
        }

        .bubble {
            padding: 12px 16px;
            border-radius: 8px;
            max-width: 80%;
        }

        .msg.antolis .bubble {
            background: #212121;
            border: 1px solid #2f2f2f;
        }

        .msg.user .bubble {
            background: #2563eb;
            color: #fff;
        }

        .input-zone {
            padding: 20px;
            background: #181818;
            border-top: 1px solid #222;
            display: flex;
            justify-content: center;
        }

        .input-box {
            max-width: 800px;
            width: 100%;
            background: #212121;
            border: 1px solid #333;
            border-radius: 12px;
            display: flex;
            padding: 8px 16px;
        }

        input {
            flex: 1;
            background: none;
            border: none;
            color: #fff;
            font-size: 14px;
            outline: none;
            padding: 8px 0;
        }

        button {
            background: #fff;
            color: #000;
            border: none;
            border-radius: 6px;
            padding: 6px 14px;
            font-weight: 600;
            cursor: pointer;
            font-size: 13px;
        }
    </style>
</head>
<body>

    <header>
        <h2>Antolis AI</h2>
    </header>

    <div id="chatContainer">
        <div class="msg antolis">
            <div class="bubble">Neural link established. Antolis interface online, sir.</div>
        </div>
    </div>

    <div class="input-zone">
        <div class="input-box">
            <input type="text" placeholder="Message Antolis..." autofocus>
            <button>Enviar</>
        </div>
    </div>

</body>
</html>
