<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Crelis</title>
<style>
:root {
    --bg: #212121;
    --bar: #171717;
    --user: #2f2f2f;
    --ink: #ececec;
    --mute: #9b9b9b;
    --line: rgba(255,255,255,0.08);
    --bad: #f06a6a;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
    background: var(--bg);
    color: var(--ink);
    font-family: "Segoe UI", sans-serif;
    display: flex;
    flex-direction: column;
}
body.boot header,
body.boot main,
body.boot form { opacity: 0; visibility: hidden; }
header, main, form { transition: opacity .4s ease; }
.aurora-wrap {
    position: fixed;
    z-index: 30;
    left: 16px;
    top: 12px;
    width: 32px;
    height: 32px;
    cursor: pointer;
    transition: top .55s ease, left .55s ease, width .55s ease, height .55s ease, transform .55s ease;
}
body.boot .aurora-wrap {
    left: 50%;
    top: 46%;
    width: min(72vw, 300px);
    height: min(72vw, 300px);
    transform: translate(-50%, -50%);
}
header {
    height: 56px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 16px;
    border-bottom: 1px solid var(--line);
}
.brand { display: flex; align-items: center; gap: 10px; font-weight: 600; padding-left: 42px; }
.meta { color: var(--mute); font-size: 13px; text-align: right; }
#estado.bad { color: var(--bad); }
main { flex: 1; overflow: auto; padding: 24px 0 12px; }
.col { max-width: 760px; margin: 0 auto; padding: 0 16px; }
.msg { display: flex; gap: 14px; padding: 14px 0; }
.msg.user { justify-content: flex-end; }
.bubble {
    background: var(--user);
    border-radius: 22px;
    padding: 12px 16px;
    max-width: 85%;
    line-height: 1.45;
}
.msg .aurora { width: 32px; height: 32px; flex: 0 0 32px; }
.aurora {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    position: relative;
    overflow: hidden;
    background: #06140f;
    box-shadow: 0 0 14px rgba(80, 220, 170, 0.35);
}
.aurora i {
    position: absolute;
    inset: -50%;
    background:
        radial-gradient(circle at 30% 40%, rgba(140, 255, 200, 0.95), transparent 40%),
        radial-gradient(circle at 70% 55%, rgba(110, 90, 255, 0.8), transparent 42%),
        radial-gradient(circle at 45% 80%, rgba(40, 190, 150, 0.85), transparent 38%);
    animation: drift 6s ease-in-out infinite alternate;
}
.aurora.listening { box-shadow: 0 0 16px rgba(140, 255, 200, 0.7); }
.aurora.speaking i { animation-duration: 1.4s; }
@keyframes drift {
    from { transform: translate(-6%, -4%) rotate(0deg); }
    to { transform: translate(8%, 6%) rotate(18deg); }
}
form { padding: 8px 16px 16px; }
.composer {
    max-width: 760px;
    margin: 0 auto;
    display: flex;
    gap: 8px;
    align-items: flex-end;
    background: var(--bar);
    border: 1px solid var(--line);
    border-radius: 26px;
    padding: 8px 8px 8px 10px;
}
textarea {
    flex: 1;
    resize: none;
    height: 44px;
    border: 0;
    outline: none;
    background: transparent;
    color: var(--ink);
    font: 16px/1.4 "Segoe UI", sans-serif;
    padding: 10px 0;
}
.side, .send {
    height: 36px;
    border: 0;
    border-radius: 18px;
    cursor: pointer;
    font-size: 12px;
    letter-spacing: 0.06em;
}
.side { background: transparent; color: var(--ink); padding: 0 10px; }
.side.active { background: #1c3a30; color: #b6ffdf; }
.send {
    width: 36px;
    border-radius: 50%;
    background: #fff;
    color: #111;
    font-size: 18px;
}
</style>
</head>
<body class="boot">
<div class="aurora-wrap" id="face-wrap">
    <div class="aurora" id="face"><i></i></div>
</div>
<header>
    <div class="brand">Crelis</div>
    <div class="meta"><span id="fecha"></span><br><span id="estado">Guardado</span></div>
</header>
<main>
    <div class="col" id="libro"></div>
</main>
<form id="linea">
    <div class="composer">
        <button type="button" class="side" id="mic-btn">VOZ</button>
        <button type="button" class="side" id="mute-btn">MUTE</button>
        <textarea id="texto" placeholder="Escribe lo que hay que anotar" required></textarea>
        <button class="send" type="submit" aria-label="Enviar">↑</button>
    </div>
</form>
<script>
const KEY = "crelis-libro-v3";
const libro = document.getElementById("libro");
const estado = document.getElementById("estado");
const face = document.getElementById("face");
const micBtn = document.getElementById("mic-btn");
document.getElementById("fecha").textContent = new Date().toLocaleDateString("es-MX", { day: "numeric", month: "short" });

let listening = false;
let recognition = null;
let mouthOpen = false;

function hush() {
    window.speechSynthesis.cancel();
    mouthOpen = false;
    face.classList.remove("speaking");
}
function speak(text) {
    const clean = String(text || "").replace(/[*_`]/g, " ").replace(/\s{2,}/g, " ").trim();
    if (!clean) return;
    const synth = window.speechSynthesis;
    synth.cancel();
    const utter = new SpeechSynthesisUtterance(clean);
    utter.lang = "es-MX";
    const voices = synth.getVoices();
    const voice = voices.find((v) => /sabina|paulina|m[oó]nica|helena/i.test(v.name) && v.lang.toLowerCase().startsWith("es"))
        || voices.find((v) => v.lang.toLowerCase().startsWith("es"));
    if (voice) utter.voice = voice;
    utter.rate = 1;
    utter.onstart = () => { mouthOpen = true; face.classList.add("speaking"); };
    utter.onend = () => { mouthOpen = false; face.classList.remove("speaking"); };
    synth.speak(utter);
}
function load() {
    try { return JSON.parse(localStorage.getItem(KEY)) || []; }
    catch { return []; }
}
function paint(items) {
    libro.innerHTML = "";
    const list = items.length ? items : [{ who: "Crelis", text: "Hoy no hay nada anotado." }];
    for (const item of list) {
        const row = document.createElement("div");
        row.className = "msg " + (item.who === "Crelis" ? "crelis" : "user");
        if (item.who === "Crelis") {
            row.innerHTML = '<div class="aurora"><i></i></div><div class="text"></div>';
            row.querySelector(".text").textContent = item.text;
        } else {
            row.innerHTML = '<div class="bubble"></div>';
            row.querySelector(".bubble").textContent = item.text;
        }
        libro.appendChild(row);
    }
    libro.parentElement.scrollTop = libro.parentElement.scrollHeight;
}
function reply(text, say) {
    items.push({ who: "Crelis", text });
    save();
    paint(items);
    if (say !== false) speak(text);
}
function save() {
    try {
        localStorage.setItem(KEY, JSON.stringify(items));
        estado.textContent = "Guardado";
        estado.classList.remove("bad");
    } catch {
        estado.textContent = "No quedó anotado";
        estado.classList.add("bad");
    }
}
function takeOrder(transcript) {
    const lower = transcript.toLowerCase();
    if (/^(silencio|basta|ya|mute|callate|cállate)$/i.test(lower)) {
        hush();
        return;
    }
    const order = transcript.replace(/oye |ok |hey /ig, "").replace(/crelis|creles|krelis/ig, "").replace(/^[,.\s]+/, "").trim();
    if (!order) return;
    items.push({ who: "Tú", text: order });
    reply("Quedó anotado. No agregué nada que tú no hayas escrito.");
}
function stopMic() {
    listening = false;
    micBtn.classList.remove("active");
    face.classList.remove("listening");
    if (recognition) recognition.stop();
}
function startMic() {
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) { estado.textContent = "Este navegador no oye"; return; }
    recognition = new SR();
    recognition.lang = "es-MX";
    recognition.continuous = true;
    recognition.interimResults = false;
    recognition.onresult = (event) => {
        if (mouthOpen) return;
        let transcript = "";
        for (let i = event.resultIndex; i < event.results.length; i++) {
            if (event.results[i].isFinal) transcript += event.results[i][0].transcript;
        }
        transcript = transcript.trim();
        if (transcript) takeOrder(transcript);
    };
    recognition.onend = () => { if (listening) setTimeout(() => { try { recognition.start(); } catch (e) {} }, 300); };
    recognition.onerror = (event) => {
        if (event.error !== "no-speech" && listening) setTimeout(() => { try { recognition.start(); } catch (e) {} }, 800);
    };
    listening = true;
    micBtn.classList.add("active");
    face.classList.add("listening");
    try { recognition.start(); } catch (e) {}
}
function engage() {
    document.body.classList.remove("boot");
}
document.getElementById("face-wrap").addEventListener("click", () => {
    engage();
    hush();
});
document.addEventListener("keydown", (e) => {
    if (document.body.classList.contains("boot") && e.key.length === 1 && !e.ctrlKey && !e.metaKey) engage();
});
micBtn.addEventListener("click", () => { engage(); listening ? stopMic() : startMic(); });
document.getElementById("mute-btn").addEventListener("click", hush);

let items = load();
if (!items.length) {
    items = [
        { who: "Tú", text: "El patrón pidió contar los de la cerca norte." },
        { who: "Crelis", text: "Quedó anotado. No hay número. No lo invento." }
    ];
    localStorage.setItem(KEY, JSON.stringify(items));
}
paint(items);
document.getElementById("linea").addEventListener("submit", (e) => {
    e.preventDefault();
    const text = document.getElementById("texto").value.trim();
    if (!text) return;
    document.getElementById("texto").value = "";
    if (/^(silencio|mute)$/i.test(text)) { hush(); return; }
    items.push({ who: "Tú", text });
    reply("Quedó anotado. No agregué nada que tú no hayas escrito.");
});
</script>
</body>
</html>
