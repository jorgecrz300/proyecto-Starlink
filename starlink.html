<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IA Siri Style Visualizer</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #050508;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      overflow: hidden;
    }

    /* Contenedor central del canvas (Aurora) */
    .visualizer-wrapper {
      flex: 1;
      width: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      position: relative;
    }

    canvas {
      width: 320px;
      height: 320px;
      border-radius: 50%;
      cursor: pointer;
      filter: blur(8px);
      transition: opacity 0.3s ease;
    }

    .status-badge {
      margin-top: 1.5rem;
      font-size: 0.85rem;
      letter-spacing: 0.5px;
      color: #8e8e93;
      background: rgba(255, 255, 255, 0.05);
      padding: 6px 16px;
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
    }

    /* Interfaz de Chat Estilo iOS */
    .chat-wrapper {
      width: 100%;
      max-width: 520px;
      padding: 1.5rem 1rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .messages-container {
      max-height: 160px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
      padding-right: 4px;
    }

    .messages-container::-webkit-scrollbar {
      width: 4px;
    }

    .messages-container::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.2);
      border-radius: 4px;
    }

    .bubble {
      padding: 0.75rem 1.1rem;
      border-radius: 18px;
      font-size: 0.92rem;
      line-height: 1.4;
      max-width: 82%;
    }

    .bubble.ai {
      background: rgba(255, 255, 255, 0.08);
      color: #f2f2f7;
      align-self: flex-start;
      border-bottom-left-radius: 4px;
      backdrop-filter: blur(12px);
    }

    .bubble.user {
      background: linear-gradient(135deg, #0a84ff, #0066cc);
      color: #ffffff;
      align-self: flex-end;
      border-bottom-right-radius: 4px;
    }

    .input-bar {
      display: flex;
      gap: 0.6rem;
      background: rgba(255, 255, 255, 0.06);
      padding: 6px 8px 6px 16px;
      border-radius: 30px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(20px);
    }

    .input-bar input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: #ffffff;
      font-size: 0.95rem;
    }

    .input-bar input::placeholder {
      color: #636366;
    }

    .input-bar button {
      background: #30d158;
      border: none;
      color: #000000;
      font-weight: 600;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.1s ease;
    }

    .input-bar button:active {
      transform: scale(0.92);
    }
  </style>
</head>
<body>

  <!-- Aurora Siri Canvas -->
  <div class="visualizer-wrapper">
    <canvas id="auroraCanvas" width="400" height="400"></canvas>
    <div class="status-badge" id="statusBadge">Haz clic en la aurora para hablar</div>
  </div>

  <!-- Chat Inferior -->
  <div class="chat-wrapper">
    <div class="messages-container" id="chatBox">
      <div class="bubble ai">Hola. Haz clic en la aurora para activar el micrófono o escribe abajo.</div>
    </div>
    <form class="input-bar" id="inputForm">
      <input type="text" id="userInput" placeholder="Escribe tu mensaje..." autocomplete="off">
      <button type="submit">↑</button>
    </form>
  </div>

  <script>
    const canvas = document.getElementById('auroraCanvas');
    const ctx = canvas.getContext('2d');
    const statusBadge = document.getElementById('statusBadge');
    const chatBox = document.getElementById('chatBox');
    const inputForm = document.getElementById('inputForm');
    const userInput = document.getElementById('userInput');

    let audioCtx, analyser, micSource;
    let isListening = false;
    let audioVolume = 0;
    let step = 0;

    // Configuración del efecto de ondas fluido
    function drawAurora() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      
      const centerX = canvas.width / 2;
      const centerY = canvas.height / 2;
      const baseRadius = 100 + audioVolume * 0.4;

      step += 0.03 + (audioVolume / 500);

      // Colores estilo Siri (Magenta, Cian, Púrpura, Azul)
      const colors = [
        'rgba(255, 45, 85, 0.5)',  // Rosa / Rojo
        'rgba(88, 86, 214, 0.6)',  // Púrpura
        'rgba(0, 122, 255, 0.6)',  // Azul Siri
        'rgba(52, 199, 89, 0.4)'   // Verde
      ];

      colors.forEach((color, index) => {
        ctx.beginPath();
        ctx.fillStyle = color;

        for (let i = 0; i <= 360; i += 5) {
          const angle = (i * Math.PI) / 180;
          // Deformación orgánica usando funciones seno y coseno combinadas
          const offset = Math.sin(angle * (index + 2) + step) * (15 + audioVolume * 0.3) +
                         Math.cos(angle * 3 - step) * (10 + audioVolume * 0.2);
          
          const r = baseRadius + offset;
          const x = centerX + r * Math.cos(angle);
          const y = centerY + r * Math.sin(angle);

          if (i === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        }

        ctx.closePath();
        ctx.fill();
      });

      requestAnimationFrame(drawAurora);
    }

    // Inicialización del audio
    async function startAudio() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        analyser = audioCtx.createAnalyser();
        micSource = audioCtx.createMediaStreamSource(stream);

        analyser.fftSize = 64;
        micSource.connect(analyser);

        isListening = true;
        statusBadge.textContent = "Escuchando...";
        processAudio();
      } catch (err) {
        statusBadge.textContent = "Micrófono no permitido";
      }
    }

    function processAudio() {
      const data = new Uint8Array(analyser.frequencyBinCount);
      
      function update() {
        if (!isListening) return;
        analyser.getByteFrequencyData(data);
        
        let sum = 0;
        for (let i = 0; i < data.length; i++) sum += data[i];
        audioVolume = sum / data.length; // Nivel de volumen actual

        requestAnimationFrame(update);
      }
      update();
    }

    canvas.addEventListener('click', () => {
      if (!isListening) startAudio();
    });

    // Manejo de la ventana de chat
    inputForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const val = userInput.value.trim();
      if (!val) return;

      appendBubble(val, 'user');
      userInput.value = '';

      setTimeout(() => {
        appendBubble('Procesando respuesta con la estructura...', 'ai');
      }, 500);
    });

    function appendBubble(text, type) {
      const div = document.createElement('div');
      div.className = `bubble ${type}`;
      div.textContent = text;
      chatBox.appendChild(div);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    // Arrancar render del canvas
    drawAurora();
  </script>
</body>
</html>
