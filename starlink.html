<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proyecto Starlink - Interfaz Avanzada</title>
    <style>
        :root {
            --glow: #00f3ff;
            --bg: #080b10;
            --panel: #111622;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body { 
            background: var(--bg); 
            color: var(--glow); 
            font-family: 'Segoe UI', system-ui, sans-serif; 
            height: 100vh; 
            display: flex; 
            flex-direction: column;
            align-items: center; 
            padding: 20px;
            overflow: hidden; 
        }

        .container { 
            width: 100%; 
            max-width: 900px; 
            height: 100%;
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            gap: 15px;
        }

        /* Rostro Cyberpunk con boca vectorial */
        .starlink-face { 
            background: radial-gradient(circle, #1a2333 0%, #0d1117 100%); 
            border: 2px solid var(--glow); 
            border-radius: 50%; 
            width: 220px; 
            height: 220px; 
            min-height: 220px;
            display: flex; 
            flex-direction: column;
            justify-content: center; 
            align-items: center; 
            position: relative; 
            box-shadow: 0 0 40px rgba(0, 243, 255, 0.25), inset 0 0 20px rgba(0, 243, 255, 0.15); 
        }

        .eyes-container { display: flex; gap: 40px; margin-bottom: 20px; }
        .eye { 
            width: 44px; 
            height: 44px; 
            background: #ffffff; 
            border-radius: 50%; 
            position: relative; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            box-shadow: 0 0 15px #ffffff;
            transition: height 0.1s ease;
        }
        .pupil { 
            width: 20px; 
            height: 20px; 
            background: #080b10; 
            border-radius: 50%; 
            position: absolute; 
            box-shadow: inset 0 0 5px var(--glow);
            transition: transform 0.05s linear;
        }

        /* SVG Boca Fluida */
        .mouth-svg {
            width: 80px;
            height: 40px;
            position: absolute;
            bottom: 35px;
        }
        .mouth-path {
            fill: none;
            stroke: var(--glow);
            stroke-width: 4;
            stroke-linecap: round;
            filter: drop-shadow(0px 0px 6px var(--glow));
            transition: d 0.08s ease;
        }

        /* Panel de Estado y Chat de Pantalla Completa */
        .status-panel { 
            font-size: 0.8em; 
            display: flex; 
            justify-content: space-between; 
            width: 100%;
            color: #8b949e; 
            letter-spacing: 1px;
            padding: 0 10px;
        }
        .status-panel b { color: var(--glow); }

        .chat-box { 
            background: var(--panel); 
            padding: 20px; 
            border-radius: 16px; 
            flex: 1;
            width: 100%;
            overflow-y: auto; 
            border: 1px solid rgba(0, 243, 255, 0.2); 
            text-align: left; 
            font-size: 0.95em; 
            display: flex;
            flex-direction: column;
            gap: 12px;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.5);
        }
        .msg { padding: 12px 16px; border-radius: 12px; max-width: 80%; line-height: 1.4; }
        .msg.user { background: rgba(88, 166, 255, 0.15); color: #c9d1d9; align-self: flex-end; border-bottom-right-radius: 2px; }
        .msg.ia { background: rgba(0, 243, 255, 0.1); color: var(--glow); align-self: flex-start; border-bottom-left-radius: 2px; }

        .input-container {
            width: 100%;
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
        }

        input { 
            flex: 1;
            padding: 16px 20px; 
            background: var(--panel); 
            border: 1px solid rgba(0, 243, 255, 0.3); 
            color: white; 
            border-radius: 30px; 
            outline: none; 
            font-size: 1em;
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
            transition: border 0.3s;
        }
        input:focus { border-color: var(--glow); box-shadow: 0 0 12px rgba(0, 243, 255, 0.3); }
    </style>
</head>
<body>
    <div class="container">
        <div class="starlink-face">
            <div class="eyes-container">
                <div class="eye"><div class="pupil"></div></div>
                <div class="eye"><div class="pupil"></div></div>
            </div>
            <!-- Boca curva SVG -->
            <svg class="mouth-svg" viewBox="0 0 100 50">
                <path class="mouth-path" id="mouthPath" d="M 20 20 Q 50 25 80 20" />
            </svg>
        </div>

        <div class="status-panel">
            <span>ESTADO: <b>SISTEMA ACTIVO</b></span>
            <span>MODO: <b>CONVERSACIÓN AMPLIA</b></span>
        </div>

        <div class="chat-box" id="chat-output">
            <div class="msg ia"><strong>Starlink:</strong> Interfaz expandida lista. Escribe tu mensaje para interactuar.</div>
        </div>

        <div class="input-container">
            <input type="text" id="user-input" placeholder="Escribe un mensaje para Starlink..." autocomplete="off">
        </div>
    </div>

    <script>
        const chatOutput = document.getElementById('chat-output');
        const mouthPath = document.getElementById('mouthPath');
        let mouthInterval;

        // Formas de boca para simular vocalización realista (Formas curva C, O, A, E)
        const mouthShapes = [
            "M 20 20 Q 50 40 80 20", // Boca abierta
            "M 25 20 Q 50 15 75 20", // Sonrisa plana
            "M 30 15 Q 50 35 70 15", // Vocal 'O'
            "M 20 20 Q 50 30 80 20", // Hablando medio
            "M 20 20 Q 50 22 80 20"  // Reposo
        ];

        function animarBoca(hablando) {
            if (hablando) {
                mouthInterval = setInterval(() => {
                    const randomShape = mouthShapes[Math.floor(Math.random() * (mouthShapes.length - 1))];
                    mouthPath.setAttribute('d', randomShape);
                }, 100);
            } else {
                clearInterval(mouthInterval);
                mouthPath.setAttribute('d', "M 20 20 Q 50 25 80 20"); // Reposo
            }
        }

        // Voz del navegador
        function hablar(texto) {
            const synth = window.speechSynthesis;
            synth.cancel();
            const utter = new SpeechSynthesisUtterance(texto);
            utter.lang = 'es-MX';
            utter.onstart = () => animarBoca(true);
            utter.onend = () => animarBoca(false);
            synth.speak(utter);
        }

        function responderLocal(mensaje) {
            const respuestas = [
                "Procesando tus datos en la interfaz extendida.",
                "Entendido. La nueva estructura visual me permite responder con mayor claridad.",
                "Recibido. Todos los sistemas responden adecuadamente.",
                "Enlace correcto. ¿Qué otra consulta deseas hacer?"
            ];
            return respuestas[Math.floor(Math.random() * respuestas.length)];
        }

        document.getElementById('user-input').addEventListener('keypress', function (e) {
            if (e.key === 'Enter' && this.value.trim() !== "") {
                const userMsg = this.value;
                chatOutput.innerHTML += `<div class="msg user"><strong>Tú:</strong> ${userMsg}</div>`;
                this.value = '';
                chatOutput.scrollTop = chatOutput.scrollHeight;

                setTimeout(() => {
                    const respuesta = responderLocal(userMsg);
                    chatOutput.innerHTML += `<div class="msg ia"><strong>Starlink:</strong> ${respuesta}</div>`;
                    hablar(respuesta);
                    chatOutput.scrollTop = chatOutput.scrollHeight;
                }, 400);
            }
        });

        // Seguimiento de ojos con cursor
        document.addEventListener('mousemove', (e) => {
            const pupils = document.querySelectorAll('.pupil');
            const x = (e.clientX / window.innerWidth - 0.5) * 18;
            const y = (e.clientY / window.innerHeight - 0.5) * 18;
            pupils.forEach(p => p.style.transform = `translate(${x}px, ${y}px)`);
        });

        // Parpadeo natural
        function parpadear() {
            const eyes = document.querySelectorAll('.eye');
            eyes.forEach(e => e.style.height = '2px');
            setTimeout(() => eyes.forEach(e => e.style.height = '44px'), 120);
            setTimeout(parpadear, Math.random() * 4000 + 2000);
        }
        parpadear();
    </script>
</body>
</html>
