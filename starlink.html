<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Starlink AI - Formas de Boca Realistas</title>
    <style>
        :root {
            --bg-color: #131314;
            --surface-color: #1e1f20;
            --primary-accent: #00f3ff;
            --text-color: #e3e3e3;
            --text-secondary: #8e8e93;
            --user-msg-bg: #282a2c;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body { 
            background-color: var(--bg-color); 
            color: var(--text-color); 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            height: 100vh; 
            display: flex; 
            flex-direction: column;
            align-items: center; 
            overflow: hidden; 
        }
        /* Header con el Rostro */
        .app-header {
            width: 100%;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            background: linear-gradient(180deg, rgba(19,19,20,1) 80%, rgba(19,19,20,0) 100%);
            z-index: 10;
        }
        .starlink-face { 
            background: radial-gradient(circle, #1a2333 0%, #0d1117 100%); 
            border: 2px solid var(--primary-accent); 
            border-radius: 50%; 
            width: 140px; 
            height: 140px; 
            display: flex; 
            flex-direction: column;
            justify-content: center; 
            align-items: center; 
            position: relative; 
            box-shadow: 0 0 25px rgba(0, 243, 255, 0.2); 
        }
        .eyes-container { display: flex; gap: 28px; margin-bottom: 12px; }
        .eye { 
            width: 28px; 
            height: 28px; 
            background: #ffffff; 
            border-radius: 50%; 
            position: relative; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            box-shadow: 0 0 10px #ffffff;
            transition: height 0.1s ease;
        }
        .pupil { 
            width: 12px; 
            height: 12px; 
            background: #080b10; 
            border-radius: 50%; 
            position: absolute; 
            transition: transform 0.05s linear;
        }
        /* SVG Boca con Relleno para Abrir/Cerrar */
        .mouth-svg {
            width: 60px;
            height: 35px;
            position: absolute;
            bottom: 15px;
        }
        .mouth-path {
            fill: rgba(0, 243, 255, 0.2);
            stroke: var(--primary-accent);
            stroke-width: 2.5;
            stroke-linejoin: round;
            stroke-linecap: round;
            filter: drop-shadow(0px 0px 4px var(--primary-accent));
            transition: d 0.07s ease;
        }
        /* Feed Estilo Chat AI (Gemini / ChatGPT) */
        .chat-container {
            flex: 1;
            width: 100%;
            max-width: 768px;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }
        .chat-container::-webkit-scrollbar { width: 6px; }
        .chat-container::-webkit-scrollbar-thumb { background: #333; border-radius: 4px; }
        .chat-row {
            display: flex;
            gap: 16px;
            width: 100%;
            line-height: 1.6;
            font-size: 0.98em;
        }
        .chat-row.user { justify-content: flex-end; }
        .chat-row.user .message-content {
            background-color: var(--user-msg-bg);
            border-radius: 20px;
            padding: 12px 20px;
            max-width: 80%;
        }
        .chat-row.ai { align-items: flex-start; }
        .avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8em;
            font-weight: bold;
            flex-shrink: 0;
        }
        .avatar.ai-avatar {
            background: rgba(0, 243, 255, 0.15);
            border: 1px solid var(--primary-accent);
            color: var(--primary-accent);
        }
        .message-content {
            color: var(--text-color);
            padding-top: 2px;
            max-width: 88%;
        }
        /* Input Inferior */
        .prompt-wrapper {
            width: 100%;
            max-width: 768px;
            padding: 0 20px 20px 20px;
        }
        .prompt-container {
            background-color: var(--surface-color);
            border: 1px solid #333537;
            border-radius: 28px;
            display: flex;
            align-items: center;
            padding: 6px 12px 6px 20px;
            transition: border-color 0.2s;
        }
        .prompt-container:focus-within { border-color: #55585d; }
        input {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: var(--text-color);
            font-size: 1em;
            padding: 10px 0;
        }
        input::placeholder { color: var(--text-secondary); }
        .send-btn {
            background-color: var(--text-color);
            border: none;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: opacity 0.2s;
        }
        .send-btn:hover { opacity: 0.85; }
        .send-btn svg { width: 18px; height: 18px; fill: #131314; }
        .disclaimer {
            text-align: center;
            font-size: 0.75em;
            color: var(--text-secondary);
            margin-top: 8px;
        }
    </style>
</head>
<body>
    <header class="app-header">
        <div class="starlink-face">
            <div class="eyes-container">
                <div class="eye"><div class="pupil"></div></div>
                <div class="eye"><div class="pupil"></div></div>
            </div>
            <svg class="mouth-svg" viewBox="0 0 100 50">
                <path class="mouth-path" id="mouthPath" d="M 25 25 Q 50 25 75 25 Z" />
            </svg>
        </div>
    </header>
    <main class="chat-container" id="chat-output">
        <div class="chat-row ai">
            <div class="avatar ai-avatar">✦</div>
            <div class="message-content">
                Hola, soy <strong>Starlink</strong>. La apertura de boca ahora es dinámica. ¿En qué te puedo ayudar?
            </div>
        </div>
    </main>
    <footer class="prompt-wrapper">
        <div class="prompt-container">
            <input type="text" id="user-input" placeholder="Escribe un mensaje para Starlink..." autocomplete="off">
            <button class="send-btn" id="sendBtn">
                <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
            </button>
        </div>
        <p class="disclaimer">Starlink IA - Interfaz basada en modelos de lenguaje conversacionales.</p>
    </footer>
    <script>
        const chatOutput = document.getElementById('chat-output');
        const userInput = document.getElementById('user-input');
        const sendBtn = document.getElementById('sendBtn');
        const mouthPath = document.getElementById('mouthPath');
        let mouthInterval;

        // Formas geométricas de boca
        const MOUTH_CLOSED = "M 25 25 Q 50 25 75 25 Z";
        
        const mouthOpenShapes = [
            "M 25 25 Q 50 10 75 25 Q 50 40 25 25 Z",
            "M 30 25 Q 50 15 70 25 Q 50 35 30 25 Z",
            "M 35 25 C 35 12, 65 12, 65 25 C 65 38, 35 38, 35 25 Z",
            "M 25 25 Q 50 18 75 25 Q 50 32 25 25 Z"
        ];

        // ANIMACIÓN DE BOCA MANTENIDA
        function animarBoca(hablando) {
            if (hablando) {
                mouthInterval = setInterval(() => {
                    const randomShape = mouthOpenShapes[Math.floor(Math.random() * mouthOpenShapes.length)];
                    mouthPath.setAttribute('d', randomShape);
                }, 90);
            } else {
                clearInterval(mouthInterval);
                mouthPath.setAttribute('d', MOUTH_CLOSED);
            }
        }

        // VOZ (VOICE SYNTHESIS) MANTENIDA
        function hablar(texto) {
            const synth = window.speechSynthesis;
            synth.cancel();
            const utter = new SpeechSynthesisUtterance(texto);
            utter.lang = 'es-MX';
            utter.onstart = () => animarBoca(true);
            utter.onend = () => animarBoca(false);
            synth.speak(utter);
        }

        async function enviarMensaje() {
            const text = userInput.value.trim();
            if (!text) return;

            const userRow = document.createElement('div');
            userRow.className = 'chat-row user';
            userRow.innerHTML = `<div class="message-content">${text}</div>`;
            chatOutput.appendChild(userRow);
            userInput.value = '';
            chatOutput.scrollTop = chatOutput.scrollHeight;

            const aiRow = document.createElement('div');
            aiRow.className = 'chat-row ai';
            aiRow.innerHTML = `
                <div class="avatar ai-avatar">✦</div>
                <div class="message-content">Pensando...</div>
            `;
            chatOutput.appendChild(aiRow);
            chatOutput.scrollTop = chatOutput.scrollHeight;

            try {
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: text })
                });

                const data = await response.json();
                const respuesta = data.reply || 'No recibí respuesta de Starlink.';

                aiRow.querySelector('.message-content').innerText = respuesta;
                
                // AQUÍ SE EJECUTA LA VOZ Y LA BOCA CUANDO EL SERVIDOR RESPONDE
                hablar(respuesta);

            } catch (error) {
                console.error(error);
                aiRow.querySelector('.message-content').innerText = 'Error al conectar con el servidor de Starlink.';
            }

            chatOutput.scrollTop = chatOutput.scrollHeight;
        }

        sendBtn.addEventListener('click', enviarMensaje);
        userInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') enviarMensaje();
        });

        document.addEventListener('mousemove', (e) => {
            const pupils = document.querySelectorAll('.pupil');
            const x = (e.clientX / window.innerWidth - 0.5) * 12;
            const y = (e.clientY / window.innerHeight - 0.5) * 12;
            pupils.forEach(p => p.style.transform = `translate(${x}px, ${y}px)`);
        });

        function parpadear() {
            const eyes = document.querySelectorAll('.eye');
            eyes.forEach(e => e.style.height = '2px');
            setTimeout(() => eyes.forEach(e => e.style.height = '28px'), 120);
            setTimeout(parpadear, Math.random() * 4000 + 2000);
        }
        parpadear();
    </script>
</body>
</html>
