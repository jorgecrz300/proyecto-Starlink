<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Asistente de Voz IA</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #0d0d11;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow: hidden;
    }

    /* Área central con el orbe / aurora */
    .visualizer-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .orb {
      width: 150px;
      height: 150px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(147, 51, 234, 1) 0%, rgba(59, 130, 246, 0.8) 50%, rgba(236, 72, 153, 0) 70%);
      box-shadow: 0 0 60px rgba(147, 51, 234, 0.6), 0 0 100px rgba(59, 130, 246, 0.4);
      cursor: pointer;
      transition: transform 0.05s ease-out, box-shadow 0.05s ease-out;
      animation: float 4s ease-in-out infinite;
    }

    .status-text {
      margin-top: 2rem;
      font-size: 0.9rem;
      color: #a1a1aa;
    }

    /* Animación de flotación básica cuando no detecta audio */
    @keyframes float {
      0%, 100% { transform: translateY(0px) scale(1); }
      50% { transform: translateY(-10px) scale(1.02); }
    }

    /* Sección del chat inferior */
    .chat-container {
      width: 100%;
      max-width: 600px;
      margin: 0 auto;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .messages {
      max-height: 180px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      padding-right: 0.5rem;
    }

    .message {
      padding: 0.6rem 1rem;
      border-radius: 12px;
      font-size: 0.95rem;
      max-width: 80%;
    }

    .message.system {
      background-color: #1e1e24;
      align-self: flex-start;
      color: #e4e4e7;
    }

    .message.user {
      background-color: #3b82f6;
      align-self: flex-end;
      color: #ffffff;
    }

    .input-form {
      display: flex;
      gap: 0.5rem;
    }

    .input-form input {
      flex: 1;
      padding: 0.8rem 1rem;
      border-radius: 24px;
      border: 1px solid #27272a;
      background-color: #18181b;
      color: #ffffff;
      outline: none;
    }

    .input-form input:focus {
      border-color: #3b82f6;
    }

    .input-form button {
      padding: 0.8rem 1.2rem;
      border-radius: 24px;
      border: none;
      background-color: #3b82f6;
      color: #ffffff;
      font-weight: bold;
      cursor: pointer;
    }

    .input-form button:hover {
      background-color: #2563eb;
    }
  </style>
</head>
<body>

  <!-- Contenedor de la esfera brillante / aurora -->
  <main class="visualizer-container">
    <div class="orb" id="orb"></div>
    <p class="status-text" id="statusText">Haz clic en el orbe para activar el micrófono</p>
  </main>

  <!-- Área de Chat e entrada de texto -->
  <footer class="chat-container">
    <div class="messages" id="messages">
      <div class="message system">Hola, ¿en qué puedo ayudarte hoy?</div>
    </div>
    <form class="input-form" id="chatForm">
      <input type="text" id="userInput" placeholder="Escribe un mensaje..." autocomplete="off">
      <button type="submit">Enviar</button>
    </form>
  </footer>

  <script>
    const orb = document.getElementById('orb');
    const statusText = document.getElementById('statusText');
    const chatForm = document.getElementById('chatForm');
    const userInput = document.getElementById('userInput');
    const messages = document.getElementById('messages');

    let audioContext;
    let analyser;
    let microphone;
    let isListening = false;

    // Iniciar micrófono y captura de audio
    async function initAudio() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        audioContext = new (window.AudioContext || window.webkitAudioContext)();
        analyser = audioContext.createAnalyser();
        microphone = audioContext.createMediaStreamSource(stream);

        analyser.fftSize = 64;
        microphone.connect(analyser);

        isListening = true;
        statusText.textContent = "Escuchando tu voz...";
        visualize();
      } catch (err) {
        statusText.textContent = "Permiso de micrófono denegado.";
        console.error("Error al acceder al micrófono:", err);
      }
    }

    // Activar audio al dar clic en el orbe
    orb.addEventListener('click', () => {
      if (!isListening) {
        initAudio();
      }
    });

    // Animar la esfera según la intensidad del sonido
    function visualize() {
      const dataArray = new Uint8Array(analyser.frequencyBinCount);

      function renderFrame() {
        if (!isListening) return;

        requestAnimationFrame(renderFrame);
        analyser.getByteFrequencyData(dataArray);

        // Promedio de volumen
        let sum = 0;
        for (let i = 0; i < dataArray.length; i++) {
          sum += dataArray[i];
        }
        const average = sum / dataArray.length;

        // Calcular tamaño y resplandor dinámico
        const scale = 1 + average / 70;
        const glow = 60 + average * 1.5;

        orb.style.transform = `scale(${scale})`;
        orb.style.boxShadow = `0 0 ${glow}px rgba(147, 51, 234, 0.8), 0 0 ${glow * 1.5}px rgba(59, 130, 246, 0.6)`;
      }

      renderFrame();
    }

    // Manejar el envío de mensajes de texto
    chatForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const text = userInput.value.trim();
      if (!text) return;

      addMessage(text, 'user');
      userInput.value = '';

      // Respuesta simulada de la IA
      setTimeout(() => {
        addMessage("Entendido. Procesando solicitud...", 'system');
      }, 600);
    });

    function addMessage(text, sender) {
      const msgDiv = document.createElement('div');
      msgDiv.classList.add('message', sender);
      msgDiv.textContent = text;
      messages.appendChild(msgDiv);
      messages.scrollTop = messages.scrollHeight;
    }
  </script>
</body>
</html>
