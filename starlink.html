<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proyecto Starlink - Interfaz IA</title>
    <style>
        :root {
            --glow: #00f3ff;
            --bg: #080b10;
            --panel: #111622;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: var(--bg); color: var(--glow); font-family: 'Segoe UI', system-ui, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; }
        .container { text-align: center; width: 90%; max-width: 420px; display: flex; flex-direction: column; align-items: center; }

        /* Rostro Cyberpunk / Neón */
        .starlink-face { 
            background: radial-gradient(circle, #1a2333 0%, #0d1117 100%); 
            border: 2px solid var(--glow); 
            border-radius: 50%; 
            width: 240px; 
            height: 240px; 
            margin-bottom: 25px; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            position: relative; 
            box-shadow: 0 0 40px rgba(0, 243, 255, 0.25), inset 0 0 20px rgba(0, 243, 255, 0.15); 
        }

        .eyes-container { display: flex; gap: 40px; margin-bottom: 25px; }
        .eye { 
            width: 48px; 
            height: 48px; 
            background: #ffffff; 
            border-radius: 50%; 
            position: relative; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            box-shadow: 0 0 15px #ffffff;
            transition: height 0.1s ease;
        }
        .pupil { 
            width: 22px; 
            height: 22px; 
            background: #080b10; 
            border-radius: 50%; 
            position: absolute; 
            box-shadow: inset 0 0 5px var(--glow);
            transition: transform 0.05s linear;
        }

        /* Boca Ecualizadora */
        .mouth-container {
            position: absolute;
            bottom: 45px;
            display: flex;
            align-items: center;
            gap: 4px;
            height: 30px;
        }
        .mouth-bar {
            width: 6px;
            height: 4px;
            background: var(--glow);
            border-radius: 4px;
            box-shadow: 0 0 10px var(--glow);
            transition: height 0.05s ease;
        }

        /* Panel de Estado y Chat */
        .status-panel { 
            font-size: 0.75em; 
            margin-bottom: 12px; 
            display: flex; 
            justify-content: space-between; 
            width: 100%;
            color: #8b949e; 
            letter-spacing: 1px;
        }
        .status-panel b { color: var(--glow); }

        .chat-box { 
            background: var(--panel); 
            padding: 15px; 
            border-radius: 14px; 
            height: 180px; 
            width: 100%;
            overflow-y: auto; 
            margin-bottom: 12px; 
            border: 1px solid rgba(0, 243, 255, 0.2); 
            text-align: left; 
            font-size: 0.88em; 
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .msg { padding: 8px 12px; border-radius: 8px; max-width: 85%; }
        .msg.user { background: rgba(88, 166, 255, 0.15); color: #c9d1d9; align-self: flex-end; }
        .msg.ia { background: rgba(0, 243, 255, 0.1); color: var(--glow); align-self: flex-start; }

        input { 
            width: 100%; 
            padding: 14px; 
            background: var(--panel); 
            border: 1px solid rgba(0, 243, 255, 0.3); 
            color: white; 
            border-radius: 25px; 
            outline: none; 
            font-size: 0.9em;
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
            transition: border 0.3s;
        }
        input:focus { border-color: var(--glow); box-shadow: 0 0 12px rgba(0, 243, 255, 0.3); }
    </style>
</head>
<body>
    <div class="container">
        <div class="starlink-face">
            <div class="eyes-container">
                <div class="eye"><div class="pupil"></div></div>
                <div class="eye"><div class="pupil"></div></div>
            </div>
            <div class="mouth-container">
                <div class="mouth-bar"></div>
                <div class="mouth-bar"></div>
                <div class="mouth-bar"></div>
                <div class="mouth-bar"></div>
                <div class="mouth-bar"></div>
            </div>
        </div>

        <div class="status-panel">
            <span>ESTADO: <b>DEMO LOCAL</b></span>
            <span>NÚCLEO: <b>SISTEMA ACTIVO</b></span>
        </div>

        <div class="chat-box" id="chat-output">
            <div class="msg ia"><strong>Starlink:</strong> Sistema iniciado. Escribe un mensaje abajo.</div>
        </div>
        <input type="text" id="user-input" placeholder="Escribe un mensaje para Starlink..." autocomplete="off">
    </div>

    <script>
        const chatOutput = document.getElementById('chat-output');
        const bars = document.querySelectorAll('.mouth-bar');
        let mouthInterval;

        // Modulación de boca al hablar
        function animarBoca(hablando) {
            if (hablando) {
                mouthInterval = setInterval(() => {
                    bars.forEach(bar => {
                        const height = Math.floor(Math.random() * 22) + 4;
                        bar.style.height = `${height}px`;
                    });
                }, 80);
            } else {
                clearInterval(mouthInterval);
                bars.forEach((bar, i) => bar.style.height = i === 2 ? '10px' : '4px');
            }
        }

        // Síntesis de Voz del navegador
        function hablar(texto) {
            const synth = window.speechSynthesis;
            synth.cancel();
            const utter = new SpeechSynthesisUtterance(texto);
            utter.lang = 'es-MX';
            utter.onstart = () => animarBoca(true);
            utter.onend = () => animarBoca(false);
            synth.speak(utter);
        }

        // Respuesta simulada local
        function responderLocal(mensaje) {
            const respuestas = [
                "Entendido. Sistema procesando tus datos.",
                "Enlace local activo. ¿En qué te ayudo?",
                "Recibido, estoy listo para la siguiente instrucción.",
                "Estructura lista y funcionando correctamente."
            ];
            return respuestas[Math.floor(Math.random() * respuestas.length)];
        }

        // Evento de chat
        document.getElementById('user-input').addEventListener('keypress', function (e) {
            if (e.key === 'Enter' && this.value.trim() !== "") {
                const userMsg = this.value;
                chatOutput.innerHTML += `<div class="msg user"><strong>Tú:</strong> ${userMsg}</div>`;
                this.value = '';
                chatOutput.scrollTop = chatOutput.scrollHeight;

                setTimeout(() => {
                    const respuesta = responderLocal(userMsg);
                    chatOutput.innerHTML += `<div class="msg ia"><strong>Starlink:</strong> ${respuesta}</div>`;
                    hablar(respuesta);
                    chatOutput.scrollTop = chatOutput.scrollHeight;
                }, 400);
            }
        });

        // Seguimiento de ojos con el mouse
        document.addEventListener('mousemove', (e) => {
            const pupils = document.querySelectorAll('.pupil');
            const x = (e.clientX / window.innerWidth - 0.5) * 20;
            const y = (e.clientY / window.innerHeight - 0.5) * 20;
            pupils.forEach(p => p.style.transform = `translate(${x}px, ${y}px)`);
        });

        // Parpadeo automático aleatorio
        function parpadear() {
            const eyes = document.querySelectorAll('.eye');
            eyes.forEach(e => e.style.height = '2px');
            setTimeout(() => eyes.forEach(e => e.style.height = '48px'), 120);
            setTimeout(parpadear, Math.random() * 4000 + 2000);
        }
        parpadear();
    </script>
</body>
</html>
